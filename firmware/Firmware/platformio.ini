; Source files sit directly in this folder, so src_dir points here rather than
; at the nested layout this was extracted from.
[platformio]
src_dir = .
; A bare `pio run` builds the course firmware and nothing else. Without this
; PlatformIO builds every environment, leaving a transmitting .uf2 in
; .pio/build/ for somebody to flash by mistake.
default_envs = pico_tinyusb_nolib

; ---------------------------------------------------------------------------
; Stock firmware, radio active. Kept so verify.sh can compare binaries. It has
; to disable the guard explicitly, because the source defaults to radio-off.
; Never flash this for the course.
[env:pico_tinyusb]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags = -DUSE_TINYUSB -DFLATSAT_NO_RADIO=0
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    makuna/NeoPixelBus @ ^2.8.0
    sparkfun/SparkFun LIS2DH12 Arduino Library @ ^1.0.3
    adafruit/Adafruit BME280 Library @ ^2.2.4

; ---------------------------------------------------------------------------
; THE COURSE BUILD.
;
; Three independent reasons this cannot transmit:
;
;   1. The driver is not compiled in. ruplink.cpp and rdownlink.cpp are the
;      only files that include RadioLib or construct an SX1262, and both are
;      excluded, so the linker has no transmit code to keep. verify.sh counts
;      the symbols: zero.
;   2. Every call site that would drive a radio is compiled out.
;   3. radioHoldInReset() drives both RESET lines low as the first statement
;      of setup(), so the parts stay in reset while the board has power.
;
; FLATSAT_GPS_OVERRIDE exists because the position-spoofing lab has no USB
; path on stock firmware: that attack is over the air, against the GPS
; receiver. With the radio gone there is no way to run it, so the course build
; accepts the position on the cable instead, at the same trust boundary.
[env:pico_tinyusb_nolib]
extends = env:pico_tinyusb
build_src_filter = +<*> -<ruplink.cpp> -<rdownlink.cpp>
build_flags =
    -DUSE_TINYUSB
    -DFLATSAT_NO_RADIO=1
    -DFLATSAT_GPS_OVERRIDE=1
    -DFLATSAT_NO_RADIO_LIB=1

; ---------------------------------------------------------------------------
; Verification only, neither shipped nor flashed. These two exist so the
; safety property can be re-proved from source at any time instead of trusted.
;
;   _norf    the driver is linked but every caller is compiled out, and the
;            parts are held in reset. This was the course build until the
;            driver was removed outright.
;   _noflag  no radio flag at all, which is what a careless rebuild produces.
;            It must still come out with the radio held in reset.
[env:pico_tinyusb_norf]
extends = env:pico_tinyusb
build_flags =
    -DUSE_TINYUSB
    -DFLATSAT_NO_RADIO=1
    -DFLATSAT_GPS_OVERRIDE=1

[env:pico_tinyusb_noflag]
extends = env:pico_tinyusb
build_flags = -DUSE_TINYUSB
